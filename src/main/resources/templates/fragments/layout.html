<!DOCTYPE html>
<!--/* Fragmentos reutilizables. Cada página los incluye con th:replace="~{fragments/layout :: nombre}". */-->
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Coworking Reservas'">Coworking Reservas</title>
    <!--/* Versión fija + integrity (SRI): si el CDN sirviera otro archivo, el navegador lo rechaza. */-->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg bg-body border-bottom mb-4">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">Coworking<span class="text-primary">Reservas</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
                aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Espacios</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/mis-reservas}">Mis reservas</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                       aria-expanded="false">Admin</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/admin/recursos}">Recursos</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/reservas}">Reservas</a></li>
                    </ul>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-2" sec:authorize="!isAuthenticated()">
                <a class="btn btn-outline-primary btn-sm" th:href="@{/login}">Entrar</a>
                <a class="btn btn-primary btn-sm" th:href="@{/registro}">Crear cuenta</a>
            </div>
            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span class="small text-body-secondary" sec:authentication="name">usuario@mail.com</span>
                <!--/* Logout por POST: th:action añade el token CSRF oculto automáticamente. */-->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-secondary btn-sm">Salir</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="alertas">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${exito}">Operación realizada</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${aviso}" class="alert alert-warning alert-dismissible fade show" role="alert">
        <span th:text="${aviso}">Aviso</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<!--/* Paginación sobre PaginaResponse; url ya trae los filtros actuales (p. ej. /mis-reservas?estado=X). */-->
<nav th:fragment="paginacion(pagina, url)" th:if="${pagina.totalPages > 1}" aria-label="Paginación">
    <ul class="pagination justify-content-center mt-4">
        <li class="page-item" th:classappend="${pagina.page == 0} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${pagina.page - 1})}">Anterior</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
            th:classappend="${i == pagina.page} ? 'active'">
            <a class="page-link" th:href="@{${url}(page=${i})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${pagina.page + 1 >= pagina.totalPages} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${pagina.page + 1})}">Siguiente</a>
        </li>
    </ul>
</nav>

<footer th:fragment="footer" class="container text-center text-body-secondary small py-4 mt-5 border-top">
    Coworking Reservas · Proyecto de portafolio con Spring Boot ·
    <a th:href="@{/swagger-ui.html}">API REST</a>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
</th:block>

</body>
</html>
