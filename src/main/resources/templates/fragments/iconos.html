<!DOCTYPE html>
<!--/*
  Iconos SVG en línea (trazos al estilo Feather, licencia MIT). En línea y no como librería externa:
  cero dependencias, heredan el color del texto (currentColor) y escalan con la fuente.
  Uso: <svg th:replace="~{fragments/iconos :: icono('calendario', '')}"></svg>
*/-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<svg th:fragment="icono(nombre, clase)" th:class="'icono ' + ${clase}" xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round" aria-hidden="true" focusable="false">
    <th:block th:switch="${nombre}">
        <th:block th:case="'usuarios'">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </th:block>
        <th:block th:case="'monitor'">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
        </th:block>
        <th:block th:case="'maletin'">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
        </th:block>
        <th:block th:case="'microfono'">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>
        </th:block>
        <th:block th:case="'calendario'">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
        </th:block>
        <th:block th:case="'reloj'">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </th:block>
        <th:block th:case="'escudo'">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>
        </th:block>
        <th:block th:case="'correo'">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
        </th:block>
        <th:block th:case="'deshacer'">
            <polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </th:block>
        <th:block th:case="'codigo'">
            <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
        </th:block>
        <th:block th:case="'check'">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
        </th:block>
        <th:block th:case="'flecha'">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </th:block>
        <th:block th:case="'repetir'">
            <polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
        </th:block>
        <th:block th:case="'izquierda'"><polyline points="15 18 9 12 15 6"/></th:block>
        <th:block th:case="'derecha'"><polyline points="9 18 15 12 9 6"/></th:block>
        <th:block th:case="'lista'">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </th:block>
        <th:block th:case="'buscar'">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </th:block>
        <th:block th:case="'salir'">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
        </th:block>
        <th:block th:case="'ajustes'">
            <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
            <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
            <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/>
            <line x1="17" y1="16" x2="23" y2="16"/>
        </th:block>
    </th:block>
</svg>

<!--/* Icono según el tipo de recurso (el nombre sale de messages.properties: icono.SALA_REUNIONES=usuarios). */-->
<svg th:fragment="tipo(tipo, clase)"
     th:replace="~{fragments/iconos :: icono(${#messages.msg('icono.' + tipo)}, ${clase})}"></svg>

</body>
</html>
