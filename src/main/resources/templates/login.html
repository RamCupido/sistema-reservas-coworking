<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Entrar')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container py-5">
    <div class="tarjeta overflow-hidden mx-auto" style="max-width: 920px">
        <div class="row g-0">
            <div th:replace="~{fragments/auth :: panel}"></div>
            <div class="col-lg-7 p-4 p-md-5">
                <h1 class="h3 mb-1">Bienvenido de nuevo</h1>
                <p class="text-body-secondary mb-4">Entra para reservar y ver tu calendario.</p>

                <!--/* Mismo mensaje exista o no el email: no se revela qué cuentas existen. */-->
                <div th:if="${param.error}" class="alert alert-danger">Email o contraseña incorrectos.</div>
                <div th:if="${param.registrado}" class="alert alert-success">Cuenta creada. Ya puedes entrar.</div>

                <!--/* El POST lo procesa el filtro formLogin de Spring Security, no un controller. */-->
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" name="email" class="form-control form-control-lg" required autofocus
                               autocomplete="username" placeholder="tu@correo.com">
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" id="password" name="password" class="form-control form-control-lg" required
                               autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">Entrar</button>
                </form>
                <p class="text-center mt-4 mb-0 small">¿No tienes cuenta? <a th:href="@{/registro}" class="fw-semibold">Créala gratis</a></p>
            </div>
        </div>
    </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
