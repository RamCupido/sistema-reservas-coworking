# Configuración común a todos los perfiles.
spring:
  application:
    name: reservas
  jpa:
    # Flyway es el dueño del esquema; Hibernate solo valida que las entidades coincidan.
    hibernate:
      ddl-auto: validate
    # Evita mantener la sesión de BD abierta durante la vista (oculta N+1 y lazy loading).
    open-in-view: false
    # Sin hibernate.jdbc.time_zone: esa propiedad también desplaza los LocalTime (TIME)
    # según la zona del servidor. Los Instant ya se guardan en UTC en columnas TIMESTAMPTZ.
  # SMTP. En dev, Mailpit (docker-compose) en localhost:1025 sin autenticación.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      # Sin timeouts, JavaMail espera indefinidamente a un SMTP colgado y bloquea el hilo.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  # Pool de hilos para @Async (envío de correos).
  task:
    execution:
      thread-name-prefix: correo-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 500
      shutdown:
        # Al apagar la app, espera a que terminen los correos en curso.
        await-termination: true
        await-termination-period: 10s
  flyway:
    enabled: true
    locations: classpath:db/migration
  # Interfaz en español (nombres de días y meses en las páginas), sin depender del navegador.
  web:
    locale: es
    locale-resolver: fixed
  data:
    web:
      pageable:
        # Evita que un cliente pida ?size=100000 y tumbe la BD.
        max-page-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      # Solo cookie: evita que el id de sesión aparezca en las URLs (;jsessionid=...).
      tracking-modes: cookie
      cookie:
        http-only: true   # JavaScript no puede leer la cookie (mitiga robo por XSS)
        same-site: lax    # el navegador no la envía en POST iniciados desde otros sitios

# JWT firmado con HS256.
jwt:
  secret: ${JWT_SECRET}
  expiracion: ${JWT_EXPIRACION:1h}

# Reglas de reservas
reservas:
  # Las fechas de la API se interpretan en la zona del coworking.
  zona-horaria: ${RESERVAS_ZONA_HORARIA:America/Guayaquil}
  anticipacion-minima-cancelacion: 2h
  tareas:
    habilitadas: true
    # Formato cron de Spring: segundo minuto hora día mes día-semana
    cron-recordatorios: "0 */15 * * * *"
    cron-completar: "0 */15 * * * *"

# Correos de reservas
notificaciones:
  habilitadas: ${NOTIFICACIONES_HABILITADAS:true}
  remitente: ${NOTIFICACIONES_REMITENTE:Coworking Reservas <no-reply@reservas.local>}
  url-base: ${NOTIFICACIONES_URL_BASE:http://localhost:8080}
  anticipacion-recordatorio: 24h

# Administrador inicial: se crea al arrancar solo si ambas variables están definidas.
admin:
  email: ${ADMIN_EMAIL:}
  password: ${ADMIN_PASSWORD:}
  nombre: ${ADMIN_NOMBRE:Administrador}

management:
  health:
    # El health de correo intenta conectar al SMTP: si cae, /actuator/health diría DOWN y la
    # plataforma reiniciaría la app aunque reservar funcione. El correo no es crítico.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
