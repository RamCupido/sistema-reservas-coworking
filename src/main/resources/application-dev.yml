# Perfil de desarrollo local.
# Lee el mismo .env que usa docker-compose, así hay una sola fuente de configuración local.
# "optional:" evita que falle si no existe; entonces se usan los valores por defecto.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:reservas}
    username: ${POSTGRES_USER:reservas}
    password: ${POSTGRES_PASSWORD:cambia-esta-clave}
  # Plantillas sin caché: los cambios en los .html se ven al recargar el navegador.
  thymeleaf:
    cache: false
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.ramses.reservas: DEBUG
