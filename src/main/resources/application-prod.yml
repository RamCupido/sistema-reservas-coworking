# Perfil de producción. Sin valores por defecto: si falta una variable, la app no arranca.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.ramses.reservas: INFO
