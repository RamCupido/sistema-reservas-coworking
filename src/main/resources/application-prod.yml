# Perfil de producción. Sin valores por defecto: si falta una variable, la app no arranca.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

# En producción la app se sirve por HTTPS: la cookie de sesión solo viaja cifrada.
server:
  servlet:
    session:
      cookie:
        secure: true

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.ramses.reservas: INFO
